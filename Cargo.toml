[package]
name = "starplay"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Video player for Windows (libmpv + Slint) with a frame-accurate checking mode"

[dependencies]
libmpv2 = "7.0.1"
slint = { version = "1.19.0", features = ["unstable-winit-030"] }
raw-window-handle = "0.6"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
libmpv2-sys = "4.0.1"

[build-dependencies]
embed-resource = "3.0.12"
